# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    upload_directory: '%kernel.project_dir%/public/uploads'
    upload_url: '/uploads'
    storage_directory: '%kernel.project_dir%/var/yandex'
    locale: 'ru'
    translator:
        fallbacks: ['en']

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    #    App\Controller\:
    #        resource: '../src/Controller'
    #        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Infrastructure\External\FileUploader:
        arguments:
            $targetDirectory: '%upload_directory%'

    App\Modules\Direction\Application\UseCase\Admin\DirectionInteractor:
        arguments:
            $targetDirectory: '%upload_directory%'

    App\Modules\Shared\Presentation\AdminHttp\Form\ImageType:
        arguments:
            $targetDirectory: '%upload_directory%'

    App\Modules\Shared\Presentation\AdminHttp\Form\FileType:
        arguments:
            $targetDirectory: '%upload_directory%'

    App\Infrastructure\Files\FileUploader:
        arguments:
            $targetDirectory: '%upload_directory%'

    App\Modules\Article\Application\UseCase\PublicSite\DTO\ArticleDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'
            $uploadDirectory: '%upload_directory%'

    App\Modules\LearningModule\Application\UseCase\PublicSite\DTO\ModuleDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Modules\ClinicalAnalysis\Application\UseCase\PublicSite\DTO\ClinicalAnalysisDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Modules\News\Application\UseCase\PublicSite\DTO\NewsDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Modules\Presidium\Application\UseCase\PublicSite\DTO\PresidiumMemberDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Modules\Document\Application\UseCase\PublicSite\DTO\DocumentDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'
            $uploadDirectory: '%upload_directory%'

    App\Modules\AdvertBanner\Application\UseCase\PublicSite\DTO\AdvertBannerDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Modules\Banner\Application\UseCase\PublicSite\DTO\BannerDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Infrastructure\External\YandexCounter:
        arguments:
            $storagePath: '%storage_directory%'
            $id: '%env(YANDEX_ID)%'
            $token: '%env(YANDEX_TOKEN)%'

    App\Modules\Customer\Application\UseCase\PublicSite\DTO\CustomerProfileDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Modules\Webinar\Application\DTO\WebinarReportFromWebinarDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Modules\News\Presentation\AdminHttp\Controller\NewsController:
        arguments:
            $targetDirectory: '%upload_directory%'
            $fileUrlPrefix: '%upload_url%'

    App\Modules\Direction\Domain\Entity\DTO\DirectionDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    App\Modules\Platform\Presentation\AdminHttp\Controller\SettingsController:
        arguments:
            $targetDirectory: '%upload_directory%'
            $fileUrlPrefix: '%upload_url%'

    App\Modules\Conference\Application\UseCase\PublicSite\DTO\ConferenceSeriesDtoAssembler:
        arguments:
            $fileUrlPrefix: '%upload_url%'

    Symfony\Bridge\Monolog\Processor\WebProcessor:
        tags: ['monolog.processor']

    App\Modules\Identity\Application\UseCase\UserInteractor:
        arguments:
            $logger: '@monolog.logger.confirmSend'

    App\Infrastructure\External\SuggestClient:
        arguments:
            $token: '%env(DADATA_TOKEN)%'

    App\Infrastructure\Logging\GlobalsProcessor:
        tags:
            - { name: monolog.processor, handler: main }

    App\Infrastructure\Legacy\Interfaces\Mailer:
        arguments:
            $mailer: '@swiftmailer.mailer.main_mailer'
            $fromAddress: '%env(MAILER_FROM_ADDRESS)%'
            $from: '%env(MAILER_FROM)%'

    app.webinar_reminder_mailer:
        class: App\Infrastructure\Legacy\Interfaces\Mailer
        arguments:
            $mailer: '@swiftmailer.mailer.webinar_mailer'
            $fromAddress: '%env(WEBINAR_MAILER_FROM_ADDRESS)%'
            $from: '%env(MAILER_FROM)%'

    App\Modules\Webinar\Application\UseCase\PublicSite\Interactor\WebinarReminderInteractor:
        arguments:
            $logger: '@monolog.logger.webinarReminder'
            $mailer: '@app.webinar_reminder_mailer'

    app.webinar_interactor_with_webinar_mailer:
        class: App\Modules\Webinar\Application\UseCase\PublicSite\Interactor\WebinarInteractor
        arguments:
            $mailer: '@app.webinar_reminder_mailer'

    app.webinar_controller_with_webinar_mailer:
        class: App\Modules\Webinar\Presentation\PublicHttp\Controller\WebinarController
        arguments:
            $interactor: '@app.webinar_interactor_with_webinar_mailer'

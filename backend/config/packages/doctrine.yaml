parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup even if your
    # environment variables are not available yet.
    # You should not need to change this value.
    env(DATABASE_URL): ''

doctrine:
    dbal:
        # configure these for your database server
        driver: 'pdo_mysql'
        server_version: '5.6'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci

        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            Domain:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/domain'
                prefix: 'App\Modules\Location\Domain\Entity'
                alias: Domain
            Customer:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/customer'
                prefix: 'App\Modules\Customer\Domain\Entity'
                alias: Customer
            Conference:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/conference'
                prefix: 'App\Modules\Conference\Domain\Entity'
                alias: Conference
            Module:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/module'
                prefix: 'App\Modules\LearningModule\Domain\Entity'
                alias: Module
            Article:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/article'
                prefix: 'App\Modules\Article\Domain\Entity'
                alias: Article
            ClinicalAnalysis:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/clinical_analysis'
                prefix: 'App\Modules\ClinicalAnalysis\Domain\Entity'
                alias: ClinicalAnalysis
            News:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/news'
                prefix: 'App\Modules\News\Domain\Entity'
                alias: News
            Banner:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/banner'
                prefix: 'App\Modules\Banner\Domain\Entity'
                alias: Banner
            AdvertBanner:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/advert_banner'
                prefix: 'App\Modules\AdvertBanner\Domain\Entity'
                alias: AdvertBanner
            PresidiumMember:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/presidium'
                prefix: 'App\Modules\Presidium\Domain\Entity'
                alias: PresidiumMember
            Document:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/document'
                prefix: 'App\Modules\Document\Domain\Entity'
                alias: Document
            Direction:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/direction'
                prefix: 'App\Modules\Direction\Domain\Entity'
                alias: Direction
            User:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/user'
                prefix: 'App\Modules\Identity\Repository'
                alias: User
            Webinar:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/webinar'
                prefix: 'App\Modules\Webinar\Domain\Entity'
                alias: Webinar
            Entity:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/entity'
                prefix: 'App\Modules\Platform\Domain\Entity'
                alias: Entity
            MainSpecialty:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/specialty'
                prefix: 'App\Modules\Specialty\Domain\Entity'
                alias: MainSpecialty
